<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قطات - تطوير التطبيقات وتصميم المواقع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0a192f;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #64ffda;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-right: 20px;
        }

        nav ul li a {
            color: #ccd6f6;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #64ffda;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        .site-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(100, 255, 218, 0.3);
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            transition: transform 0.3s ease;
        }

        .site-logo:hover {
            transform: scale(1.05);
        }

        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 0 0 40px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(100, 255, 218, 0.1) 0%, transparent 20%), radial-gradient(circle at 70% 70%, rgba(0, 100, 255, 0.1) 0%, transparent 20%), radial-gradient(circle at 50% 50%, rgba(255, 100, 255, 0.05) 0%, transparent 30%);
            z-index: -1;
        }

        .hero::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(30deg, #0a192f 12%, transparent 12.5%, transparent 87%, #0a192f 87.5%, #0a192f), linear-gradient(150deg, #0a192f 12%, transparent 12.5%, transparent 87%, #0a192f 87.5%, #0a192f), linear-gradient(30deg, #0a192f 12%, transparent 12.5%, transparent 87%, #0a192f 87.5%, #0a192f), linear-gradient(150deg, #0a192f 12%, transparent 12.5%, transparent 87%, #0a192f 87.5%, #0a192f), linear-gradient(60deg, rgba(100, 255, 218, 0.05) 25%, transparent 25.5%, transparent 75%, rgba(100, 255, 218, 0.05) 75%, rgba(100, 255, 218, 0.05));
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0;
            z-index: -2;
            opacity: 0.3;
        }

        .header-image {
            width: 100%;
            max-width: 800px;
            margin: 20px auto 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(100, 255, 218, 0.2);
            position: relative;
            overflow: hidden;
        }

        .header-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .header-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(100, 255, 218, 0.1), transparent);
            border-radius: 12px;
        }

        .content {
            width: 100%;
            z-index: 1;
            text-align: center;
        }

        .title {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ccd6f6;
        }

        .subtitle {
            font-size: 24px;
            margin-bottom: 30px;
            color: #8892b0;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .app-links {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            justify-content: center;
        }

        .app-button {
            display: flex;
            align-items: center;
            background-color: #2196F3;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .app-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(100, 255, 218, 0.2);
        }

        .app-button svg {
            margin-left: 10px;
            width: 24px;
            height: 24px;
        }

        /* تنسيقات قسم التعليقات المخصصة */
        .comments-section {
            background-color: rgba(30, 45, 64, 0.5);
            border: 1px solid rgba(100, 255, 218, 0.15);
            border-radius: 16px;
            padding: 30px;
            max-width: 800px;
            margin: 60px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .comments-title {
            font-size: 28px;
            color: #64ffda;
            margin-bottom: 25px;
            text-align: center;
        }

        #cusdis_thread iframe {
            width: 100% !important;
            min-height: 480px !important;
            border: none !important;
        }

        @media (max-width: 768px) {
            .hero {
                padding: 0 0 20px;
            }

            .title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
            }

            .app-links {
                flex-direction: column;
                align-items: center;
            }

            .site-logo {
                width: 120px;
                height: 120px;
            }

            .comments-section {
                padding: 20px 15px;
            }
        }
    </style>
</head>
